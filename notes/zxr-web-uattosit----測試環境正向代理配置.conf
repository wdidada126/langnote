user root;
worker_processes  5;

error_log  logs/error.log debug;

pid        logs/nginx.pid;

events {
    use epoll;
    worker_connections  200000;
    accept_mutex off;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile        on;
    keepalive_timeout  180;
	
	
    client_max_body_size 20M; 
    client_body_buffer_size 20M;
	client_header_buffer_size 32k;
	large_client_header_buffers 4 32k;
	proxy_headers_hash_max_size 51200;
	proxy_headers_hash_bucket_size 6400;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    log_format access '$remote_addr - $remote_user [$time_local] "$request"' '$status $body_bytes_sent "$http_referer"' '"$http_user_agent" $http_x_forwarded_for $upstream_connect_time $upstream_header_time $request_time $upstream_response_time';

