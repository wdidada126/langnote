            add_header Pragma no-cache;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
            port_in_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forward-For $remote_addr;
        }
        location ~ /v1/satl/\.* {
