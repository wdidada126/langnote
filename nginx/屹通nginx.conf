
#user  app;
worker_processes 4;
#全局错误日志及PID文件
error_log /app/nginx-1.20.0/logs/error.log notice;
pid /app/nginx-1.20.0/logs/nginx.pid;

events {
    worker_connections 51200;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset UTF-8;
    server_names_hash_bucket_size 256;
    log_format main '$remote_addr - $remote_user [$time_iso8601] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for" "$http_cookie" "$request_time"';
   
    map $time_iso8601 $logdate{
            '~^(?<ymd>\d{4}-\d{2}-\d{2})' $ymd;
            default 'date-not-found';
    }
 
    access_log /app/nginx-1.20.0/logs/access-$logdate.log main;

    #access_log /app/nginx-1.20.0/logs/access.log main;
    #access_log      off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    #客户端连接参数配置
    client_max_body_size 30m; #允许客户端请求的最大单文件字节数
    client_body_buffer_size 256k; #缓冲区代理缓冲用户端请求的最大字节数
    client_header_buffer_size 256k;
    large_client_header_buffers 4 256k;
    keepalive_timeout 10s ; #长连接时长，让ssl设备与nginx-1.20.0连接时保持长连接
    keepalive_requests 80920;

    #与后端服务连接参数配置
    proxy_connect_timeout 6000; #后端服务器连接超时时间(代理连接超时)
    proxy_send_timeout 6000; #后端服务器数据回传时间(代理发送超时时间)
    proxy_read_timeout 1200; #连接成功后，后端服务器响应时间(代理接收超时)
    proxy_buffer_size 256k; #设置代理服务器（nginx-1.20.0）保存用户头信息的缓冲区大小
    proxy_buffers 4 256k; #proxy_buffers缓冲区，网页平均在256k以下的话，这样设置
    proxy_busy_buffers_size 256k; #高负荷下缓冲大小（proxy_buffers*2）
    proxy_temp_file_write_size 256k; #设定缓存文件夹大小，大于这个值，将从upstream服务器传
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ignore_client_abort on;
    proxy_next_upstream error timeout invalid_header http_500 http_503 http_404;
    proxy_max_temp_file_size 128m;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header Cache-Control no-cache;
    proxy_set_header If-Modified-Since 0;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    #资源压缩配置
    gzip on; #开启gzip压缩输出
    gzip_min_length 1k; #最小压缩文件大小
    gzip_buffers 4 16k; #压缩缓冲区
    gzip_http_version 1.0; #压缩版本
    gzip_comp_level 5; #压缩等级1-10,数字越大压缩率越高，建议4、5
    gzip_types text/css application/javascript application/xml text/plain application/x-font-ttf ;#压缩的文件类型
    gzip_proxied any;

    fastcgi_intercept_errors on; # 单独配置此项无效

    #静态页面不缓存
    expires -1;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control no-cache;
    etag off;

    underscores_in_headers on;

    #limit_rate 512K;
    #limit_rate_after 20m ;

