            fastcgi_intercept_errors on; # 单独配置此项无效
            proxy_intercept_errors on;
            #error_page 405 =200 http://$host$request_uri;
            #dav_methods PUT;
            #deny all;
        }

        # 文件扩展名
        location ~* \.(bak|save|sh|sql|mdb|svn|git|old)$ {
            rewrite ^/(.*)$ $host permanent;
        }
        location /axios.js {
