        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$ ) {
            return 405;
        }
        location ~/(attachments|upload)/.*\.(php|php5)?$ {
            deny all;
        }
        # url参数中敏感
        if ($query_string ~* "union.*select.*\(") {
            rewrite ^/(.*)$ $host permanent;
        }
        if ($query_string ~* "concat.*\(") {
            rewrite ^/(.*)$ $host permanent;
